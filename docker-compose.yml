services:
  ai_healthcheck_db:
    image: postgres:16
    volumes:
      - postgres_healthcheck_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ai_healthcheck
      POSTGRES_USER: ai_healthcheck
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ai_healthcheck_network

volumes:
  postgres_healthcheck_data:

networks:
  ai_healthcheck_network:
